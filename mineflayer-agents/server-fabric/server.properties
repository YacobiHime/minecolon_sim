# /root/mc-server-fabric : mineflayer エージェント試験用 (Fabric 1.20.1)
# このファイルは mineflayer-agents/server-fabric/ の控えから setup.sh でコピーしたもの
server-port=25565
online-mode=false
difficulty=peaceful
gamemode=survival
level-name=world
level-type=minecraft\:normal
level-seed=1030
# 100人では各人の周囲のチャンク読み込みがサーバーの律速になる。
# view-distance 5 でもプレイヤー追跡距離は (5-1)*16=64m で、会話範囲 48m を保てる。
view-distance=5
simulation-distance=4
max-players=120
spawn-protection=0
spawn-monsters=false
enable-command-block=false
motd=mineflayer agents test (Fabric 1.20.1)
allow-flight=true
enforce-secure-profile=false
sync-chunk-writes=false
# ボットとサーバーは同じマシン。圧縮の CPU を使わず loopback の帯域を使う。
network-compression-threshold=-1
